name: Build/release

on: 
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest]

    steps:
      - name: Debug GH_TOKEN
        run: echo "GH_TOKEN status check (disponible en repositorio)"

      - name: checkout code
        uses: actions/checkout@v4

      - name: Server setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: huellero/package-lock.json

      - name: Install dependencies
        run: |
          cd huellero
          npm install

      - name: Package Electron app for Windows
        if: matrix.os == 'windows-latest'
        run: |
          cd huellero
          npm run build:win

      - name: Determine artifact filename
        id: set_artifact_filename
        run: |
          echo "filename=huellero/release-app/Asista-Setup-*.exe" >> $GITHUB_OUTPUT
          echo "appName=Asista-Setup-1.0.0.exe" >> $GITHUB_OUTPUT
        shell: bash

      # Publish Build
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.0-build.{0}', github.run_number) }}
          name: SENA-ASISTA-${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            huellero/release-app/Asista-Setup-*.exe
            huellero/release-app/Asista-Setup-*.exe.blockmap
            huellero/build/certs/huellero-sena.cer
            huellero/build/certs/Instalar_Certificado.bat
