services:
  asista:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asista-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - TZ=America/Bogota
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - SOFIA_ENCRYPTION_KEY=${SOFIA_ENCRYPTION_KEY:-${JWT_SECRET}}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-${CORS_ORIGIN:-*}}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL:-senahuellero@gmail.com}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD:-sena2026ADSO}
      - SEED_ADMIN_NAME=${SEED_ADMIN_NAME:-Administrador}
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_PASS=${GMAIL_PASS:-}
      - ENABLE_SOFIA_SYNC=${ENABLE_SOFIA_SYNC:-true}
      - ENABLE_RPA_ROBOT=${ENABLE_RPA_ROBOT:-true}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
